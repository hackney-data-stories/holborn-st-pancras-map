<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holborn and St Pancras — by-election map</title>
<meta name="description" content="The Holborn and St Pancras by-election, ward by ward: results, turnout, census and deprivation, from public data only.">
<meta property="og:type" content="website">
<meta property="og:title" content="Holborn and St Pancras: a by-election in eleven wards">
<meta property="og:description" content="Ward-level results, turnout, census and deprivation for the Holborn and St Pancras by-election. Every figure from published sources.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Holborn and St Pancras: a by-election in eleven wards">
<meta name="twitter:description" content="Ward-level results, turnout, census and deprivation. Every figure from published sources.">
<style>
:root{
  --ink:#12130f; --ink2:#3d3f39; --mute:#6f7168; --line:#dedbd1; --bg:#faf9f5;
  --surface:#ffffff;
  /* Diverging: Green Party green to Labour red, neutral grey midpoint.
     Equal steps per arm, lightness-monotone within each arm. Green and red
     are not separable under deuteranopia, so this ramp NEVER carries meaning
     alone: Labour-leading wards are hatched, every ward is direct-labelled
     with its number, and a table view carries the same figures as text. */
  --g3:#1b6b34; --g2:#3f9b56; --g1:#8ecb9e;
  --mid:#f0efec;
  --l1:#f3a3a8; --l2:#de5560; --l3:#a91b2e;
  /* Sequential: the neutral blue ramp, used for every non-party measure so
     that turnout and demography are never mistaken for a party colour. */
  --s1:#cde2fb; --s2:#9ec5f4; --s3:#6da7ec; --s4:#3987e5; --s5:#256abf; --s6:#184f95; --s7:#0d366b;
  --serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.45}
#map{position:absolute;top:0;bottom:0;left:370px;right:12px}
body.detail-open #map{right:414px}
svg{width:100%;height:100%;display:block}
.ward{stroke:#fff;stroke-width:2;cursor:pointer;transition:stroke-width .12s}
.ward:hover{stroke:#12130f;stroke-width:3.5}
.ward.sel{stroke:#12130f;stroke-width:4.5}
.ward.out{stroke-dasharray:9 6}
.wlab{font-size:17px;font-weight:600;fill:#12130f;pointer-events:none;
  paint-order:stroke;stroke:rgba(255,255,255,.94);stroke-width:4.5px;text-anchor:middle}
.wval{font-size:26px;font-weight:700;pointer-events:none;
  paint-order:stroke;stroke:rgba(255,255,255,.94);stroke-width:5.5px;text-anchor:middle}
.ps{fill:#12130f;stroke:#fff;stroke-width:1.6;pointer-events:none}
.pslab{font-size:14px;font-weight:600;fill:#3d3f39;pointer-events:none;text-anchor:middle;
  paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px}

.pane{position:absolute;top:12px;background:rgba(255,255,255,.98);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 3px 18px rgba(0,0,0,.11);max-height:calc(100% - 24px);
  overflow-y:auto;z-index:10}
#panel{left:12px;width:346px}
#detail{right:12px;width:390px;display:none}
.pane .bd{padding:13px 16px}
.pane header{padding:14px 16px 11px;border-bottom:1px solid var(--line)}
h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
h2{margin:0 0 7px;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:var(--mute);
  font-weight:700}
.kicker{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--g3);
  font-weight:700;margin:0 0 5px}
.sub{margin:5px 0 0;color:var(--mute);font-size:11.5px}
.sec{padding:12px 16px;border-top:1px solid var(--line)}
select,button{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--ink);padding:6px 8px}
select{width:100%}
button{cursor:pointer;padding:5px 10px}
button:hover{background:var(--mid)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.mute{color:var(--mute)}
.legend{display:flex;align-items:stretch;margin-top:9px;height:15px;border-radius:3px;overflow:hidden;
  border:1px solid var(--line)}
.legend i{flex:1}
.legkeys{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:3px 0 3px 8px;border-bottom:1px solid #efece4}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700}
td.p{display:flex;align-items:center;gap:6px}
.chip{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.win{font-weight:700}
.big{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #efece4;
  font-size:12px}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
ol,ul{margin:6px 0 0;padding-left:17px;font-size:11.5px;color:var(--ink2)}
li{margin:0 0 4px}
.tierA{color:#1b6b34;font-weight:700}.tierB{color:#8a6a12;font-weight:700}.tierC{color:#a91b2e;font-weight:700}
#tip{position:fixed;z-index:40;background:#12130f;color:#fff;padding:7px 10px;border-radius:6px;
  font-size:11.5px;pointer-events:none;display:none;max-width:250px;line-height:1.4}
#tip b{display:block;font-size:12.5px;margin-bottom:2px}
#frame{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-size:10.5px;color:var(--ink2);
  pointer-events:none;background:linear-gradient(transparent,rgba(250,249,245,.9));
  display:flex;justify-content:space-between}
#tableview{position:absolute;inset:12px;background:#fff;border:1px solid var(--line);border-radius:9px;
  z-index:30;display:none;overflow:auto;padding:18px 22px}
#tableview table{font-size:12px}
#tableview td,#tableview th{padding:5px 6px}
.x{float:right;border:none;background:none;font-size:19px;line-height:1;color:var(--mute);cursor:pointer;padding:0}
@media (max-width:820px){
  #panel,#detail{position:static;width:auto;max-height:none;margin:0;border-radius:0;border-width:0 0 1px}
  html,body{overflow:auto}
  #map{position:relative;height:70vh;inset:auto;left:auto;right:auto}
  body.detail-open #map{right:auto}
  #detail{display:none}
}
</style>
</head>
<body>
<div id="map"><div id="frame"><span id="msrc"></span><span id="msig"></span></div></div>

<section class="pane" id="panel">
  <header>
    <p class="kicker">A by-election in eleven wards</p>
    <h1>Holborn and St Pancras</h1>
    <p class="sub" id="standfirst"></p>
  </header>

  <div class="sec">
    <h2>Colour the wards by</h2>
    <select id="metric"></select>
    <div class="legend" id="legend"></div>
    <div class="legkeys"><span id="lk0"></span><span id="lk1"></span></div>
    <p class="note mute" id="nodata" style="display:none">
      <span class="chip" style="background:#e8e6de;vertical-align:-1px"></span>
      Grey, marked &ldquo;&mdash;&rdquo;: no Green candidate stood, so there is no figure to show.</p>
    <p class="note" id="mdesc"></p>
    <div class="row">
      <button id="btnPS">Polling stations</button>
      <button id="btnTable">Table view</button>
    </div>
  </div>

  <div class="sec" id="headline"></div>
  <div class="sec" id="findings"></div>
  <div class="sec" id="correl"></div>
  <div class="sec" id="method"></div>
</section>

<section class="pane" id="detail"><div class="bd" id="detailbody"></div></section>
<div id="tip"></div>
<div id="tableview"><button class="x" onclick="toggleTable(false)">&times;</button><div id="tablebody"></div></div>

<script id="hspdata" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('hspdata').textContent);
const W = D.wards, META = D.meta;

const PARTY = {
  Green:{n:'Green',c:'#1b6b34'}, Lab:{n:'Labour',c:'#a91b2e'},
  CPA:{n:"Camden People's Alliance",c:'#6d4bb0'}, Con:{n:'Conservative',c:'#1c5cab'},
  Reform:{n:'Reform UK',c:'#0e8ea8'}, LD:{n:'Liberal Democrat',c:'#c8690f'},
  Ind:{n:'Independent',c:'#6f7168'}, NHP:{n:'National Housing Party',c:'#8a6a12'},
  WPB:{n:'Workers Party',c:'#7a1f4f'}, TUSC:{n:'TUSC',c:'#7a1f4f'}, Other:{n:'Other',c:'#9a9c93'}
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DIV = ['--g3','--g2','--g1','--mid','--l1','--l2','--l3'].map(css);
const SEQ = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7'].map(css);

// Diverging metrics are signed: positive means Green ahead. Sequential metrics
// are magnitudes and take the neutral blue ramp so no reader mistakes a
// demographic pattern for a party result.
const METRICS = [
  {id:'gap', label:'Green lead over Labour, May 2026', kind:'div', unit:'pts', dom:[-14,14],
   get:w=>w.derived.green_lab_gap_2026,
   desc:'Best Green candidate minus best Labour candidate, in points of the ward vote. Positive means the Greens led the ward. Hatched wards are Labour-leading; every ward carries its number.'},
  {id:'green', label:'Green share, May 2026', kind:'seq', unit:'%', dom:[20,42],
   get:w=>w.derived.green_share_2026,
   desc:'Best-performing Green candidate as a share of all parties’ best candidates. Two wards are blank because no Green candidate stood.'},
  {id:'lab', label:'Labour share, May 2026', kind:'seq', unit:'%', dom:[30,48],
   get:w=>w.derived.lab_share_2026,
   desc:'Best-performing Labour candidate, on the same basis.'},
  {id:'gsw', label:'Green change, 2022 to 2026', kind:'div', unit:'pts', dom:[-24,24],
   get:w=>w.derived.green_swing_22_26,
   desc:'Change in the Green share since the 2022 locals. Blank where the Greens did not stand in one of the two years, which is five of the eleven wards.'},
  {id:'turn', label:'Turnout, May 2026', kind:'seq', unit:'%', dom:[31,50],
   get:w=>w.e2026.turnout_pct,
   desc:'Official ward turnout at the May 2026 locals. The best available guide to who votes in a low-salience contest, which is what a by-election is.'},
  {id:'tch', label:'Turnout change, 2022 to 2026', kind:'div', unit:'pts', dom:[-8,8],
   get:w=>w.derived.turnout_change_22_26,
   desc:'Turnout rose in every ward of the seat. Green here means a bigger rise, not a Green result.'},
  {id:'elec', label:'Electorate', kind:'seq', unit:'', dom:[4800,8700],
   get:w=>w.e2026.electorate, fmt:v=>v.toLocaleString(),
   desc:'Registered electors. Derived, not published: Camden gives turnout only as a percentage. See method.'},
  {id:'pr', label:'Private renting', kind:'seq', unit:'%', dom:[25,44],
   get:w=>w.census2021.private_rent_pct,
   desc:'Households privately renting or living rent free, Census 2021.'},
  {id:'sr', label:'Social renting', kind:'seq', unit:'%', dom:[25,61],
   get:w=>w.census2021.social_rent_pct,
   desc:'Households renting from the council or a housing association, Census 2021.'},
  {id:'st', label:'Full-time students', kind:'seq', unit:'%', dom:[8,30],
   get:w=>w.census2021.student_pct,
   desc:'Residents aged 16 and over who are full-time students, Census 2021 NS-SeC.'},
  {id:'yg', label:'Aged 20 to 34', kind:'seq', unit:'%', dom:[20,42],
   get:w=>w.census2021.age_20_34_pct, desc:'Census 2021.'},
  {id:'imd', label:'Deprivation', kind:'seq', unit:'', dom:[14,37],
   get:w=>w.imd2025.mean_score_pop_wtd,
   desc:'Population-weighted mean Index of Multiple Deprivation score, 2025. Higher is more deprived.'}
];
let cur = METRICS[0], SEL = null, SHOWPS = false, P, PATHS = {}, LBL = {};

const fmtN = v => v == null ? '—' : (cur.fmt ? cur.fmt(v) : (Math.round(v*10)/10).toString());
const sign = v => (v > 0 ? '+' : '') + (Math.round(v*10)/10);

function colour(v){
  if (v == null) return '#e8e6de';
  const [a,b] = cur.dom;
  if (cur.kind === 'div'){
    const m = Math.max(Math.abs(a), Math.abs(b));
    const t = Math.max(-1, Math.min(1, v/m));            // -1 Labour … +1 Green
    return DIV[Math.min(6, Math.max(0, 3 - Math.round(t*3)))];
  }
  const t = Math.max(0, Math.min(1, (v-a)/(b-a)));
  return SEQ[Math.min(6, Math.floor(t*6.999))];
}
const hatched = v => cur.kind === 'div' && v != null && v < 0;

/* ---- projection: Web Mercator fitted to the seat. No tiles, no library. */
const mercY = lat => 180/Math.PI * Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
function project(){
  let x1=999,y1=999,x2=-999,y2=-999;
  W.forEach(w => eachRing(w.geometry, r => r.forEach(([x,y]) => {
    const my = mercY(y);
    x1=Math.min(x1,x); x2=Math.max(x2,x); y1=Math.min(y1,my); y2=Math.max(y2,my);
  })));
  const WD=1000, pad=14, sc=(WD-2*pad)/(x2-x1), H=Math.round((y2-y1)*sc+2*pad);
  return {W:WD, H, to:([x,y]) => [(x-x1)*sc+pad, (y2-mercY(y))*sc+pad]};
}
function eachRing(g, cb){
  (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(poly => poly.forEach(cb));
}
const el = (t,a={}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

function build(){
  P = project();
  const svg = el('svg', {viewBox:`0 0 ${P.W} ${P.H}`, preserveAspectRatio:'xMidYMid meet',
    role:'group', 'aria-label':'Map of the eleven Camden wards in the Holborn and St Pancras constituency.'});

  // 45-degree hatch marks the Labour-leading arm of the diverging ramp, so the
  // party direction survives deuteranopia, greyscale printing and forced colours.
  const defs = el('defs');
  defs.insertAdjacentHTML('beforeend',
    `<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
       <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(255,255,255,.85)" stroke-width="2.6"/>
     </pattern>`);
  svg.appendChild(defs);

  const gShapes = el('g'), gHatch = el('g'), gLab = el('g'), gPS = el('g', {id:'gps'});
  W.forEach(w => {
    let d = '';
    eachRing(w.geometry, r => { d += 'M' + r.map(c => P.to(c).map(n => n.toFixed(1)).join(' ')).join('L') + 'Z'; });
    const p = el('path', {d, class:'ward' + (w.in_constituency_frac_pop < .9 ? ' out' : ''),
      role:'button', tabindex:'0', 'aria-label':w.ward});
    p.addEventListener('mousemove', e => tip(w, e.clientX+14, e.clientY+14));
    p.addEventListener('mouseleave', () => document.getElementById('tip').style.display='none');
    p.addEventListener('click', () => select(w.ward));
    p.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); select(w.ward); }});
    PATHS[w.ward] = p; gShapes.appendChild(p);

    const h = el('path', {d, fill:'url(#hatch)', 'pointer-events':'none'});
    PATHS[w.ward + '::h'] = h; gHatch.appendChild(h);

    // Labels sit on the polygon's representative point, computed in the build
    // step, so they land inside crescent and L-shaped wards where a centroid
    // would not. Name above, value below, far enough apart not to collide.
    const [lx, ly] = P.to(w.label_point);
    const name = el('text', {x:lx.toFixed(1), y:(ly-13).toFixed(1), class:'wlab'});
    name.textContent = w.ward.replace(' and ', ' & ')
      .replace('St Pancras & Somers Town', 'St Pancras & Somers T.')
      .replace('Holborn & Covent Garden', 'Holborn & Cov. Gdn');
    const val = el('text', {x:lx.toFixed(1), y:(ly+18).toFixed(1), class:'wval'});
    LBL[w.ward] = val; gLab.appendChild(name); gLab.appendChild(val);
  });

  D.polling_stations.forEach(s => {
    const [x,y] = P.to([s.lon, s.lat]);
    gPS.appendChild(el('circle', {cx:x.toFixed(1), cy:y.toFixed(1), r:3.4, class:'ps'}));
    const t = el('text', {x:x.toFixed(1), y:(y-6).toFixed(1), class:'pslab'});
    t.textContent = s.pd; gPS.appendChild(t);
  });
  gPS.style.display = 'none';

  svg.appendChild(gShapes); svg.appendChild(gHatch); svg.appendChild(gLab); svg.appendChild(gPS);
  document.getElementById('map').insertBefore(svg, document.getElementById('frame'));
}

function paint(){
  W.forEach(w => {
    const v = cur.get(w);
    PATHS[w.ward].setAttribute('fill', colour(v));
    PATHS[w.ward + '::h'].style.display = hatched(v) ? '' : 'none';
    const t = LBL[w.ward];
    t.textContent = v == null ? '—' : (cur.kind === 'div' ? sign(v) : fmtN(v)) + (cur.unit === '%' ? '%' : '');
    t.setAttribute('fill', v == null ? '#6f7168' : '#12130f');
  });
  const ramp = cur.kind === 'div' ? DIV.slice().reverse() : SEQ;
  document.getElementById('legend').innerHTML = ramp.map(c => `<i style="background:${c}"></i>`).join('');
  const [a,b] = cur.dom;
  document.getElementById('lk0').textContent = cur.kind === 'div'
    ? `Labour ahead by ${Math.abs(a)}${cur.unit==='pts'?' pts':''}` : (cur.fmt?cur.fmt(a):a) + (cur.unit==='%'?'%':'');
  document.getElementById('lk1').textContent = cur.kind === 'div'
    ? `Green ahead by ${b}${cur.unit==='pts'?' pts':''}` : (cur.fmt?cur.fmt(b):b) + (cur.unit==='%'?'%':'');
  document.getElementById('mdesc').textContent = cur.desc;
  document.getElementById('nodata').style.display =
    W.some(w => cur.get(w) == null) ? 'block' : 'none';
}

function tip(w, x, y){
  if (window.matchMedia('(hover: none)').matches) return;
  const t = document.getElementById('tip'), v = cur.get(w);
  t.innerHTML = `<b>${w.ward}</b>${cur.label}: <b style="display:inline">${
    v==null ? 'no candidate' : (cur.kind==='div'?sign(v):fmtN(v)) + (cur.unit==='%'?'%':cur.unit==='pts'?' pts':'')}</b>`;
  t.style.display='block';
  t.style.left = Math.min(x, innerWidth-262)+'px'; t.style.top = Math.min(y, innerHeight-90)+'px';
}

function resultTable(e, title, basis){
  if (!e) return '';
  const rows = Object.entries(e.best).map(([p,d]) =>
    `<tr><td class="p"><span class="chip" style="background:${(PARTY[p]||PARTY.Other).c}"></span>${
      (PARTY[p]||PARTY.Other).n}</td><td>${d.candidate.split(',')[0]}</td>
      <td>${d.votes.toLocaleString()}</td><td class="win">${d.share_pct}%</td></tr>`).join('');
  return `<h2 style="margin-top:14px">${title}</h2>
    <table><thead><tr><th>Party</th><th>Best candidate</th><th>Votes</th><th>Share</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note mute">Turnout ${e.turnout_pct}%${
      e.electorate ? ' · electorate about ' + e.electorate.toLocaleString()
                     + (basis && e.electorate_basis ? ' (' + e.electorate_basis + ')' : '') : ''
    }. Share is of best candidates, not of ballot papers.</p>`;
}

function select(name){
  SEL = name;
  Object.keys(PATHS).forEach(k => { if (!k.includes('::')) PATHS[k].classList.toggle('sel', k === name); });
  const w = W.find(x => x.ward === name), c = w.census2021, d = w.derived;
  const st = (l,v) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`;
  document.getElementById('detailbody').innerHTML = `
    <button class="x" onclick="closeDetail()">&times;</button>
    <p class="kicker">${w.seats} council seat${w.seats>1?'s':''}</p>
    <h1 style="font-size:17px">${w.ward}</h1>
    ${w.in_constituency_frac_pop < .9 ? `<p class="note" style="color:#a91b2e"><b>Only about ${
      Math.round(w.in_constituency_frac_pop*100)}% of this ward's residents are in the seat.</b> ${w.note||''}</p>` : ''}
    ${w.note && w.in_constituency_frac_pop >= .9 ? `<p class="note">${w.note}</p>` : ''}
    ${resultTable(w.e2026, 'May 2026 locals', true)}
    ${resultTable(w.e2022, 'May 2022 locals')}
    <h2 style="margin-top:14px">Who lives here</h2>
    ${st('Population (2021)', (c.population||0).toLocaleString())}
    ${st('Private renting', c.private_rent_pct + '%')}
    ${st('Social renting', c.social_rent_pct + '%')}
    ${st('Owner occupied', c.owner_pct + '%')}
    ${st('Full-time students', c.student_pct + '%')}
    ${st('Aged 20 to 34', c.age_20_34_pct + '%')}
    ${st('Aged 65 and over', c.age_65plus_pct + '%')}
    ${st('Degree or above', c.degree_pct + '%')}
    ${st('Deprivation score', w.imd2025.mean_score_pop_wtd)}
    <h2 style="margin-top:14px">Polling districts</h2>
    <p class="note">${D.polling_stations.filter(s => s.ward === w.ward)
        .map(s => `<b>${s.pd}</b> ${s.venue}, ${s.street}`).join('<br>') || 'None in this seat.'}</p>`;
  document.getElementById('detail').style.display = 'block';
  document.body.classList.add('detail-open');
  // On a phone the detail pane is a static block at the end of the document,
  // so tapping a ward has to take the reader to it.
  if (window.matchMedia('(max-width:820px)').matches)
    document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
}
function closeDetail(){ SEL = null; document.getElementById('detail').style.display='none';
  document.body.classList.remove('detail-open');
  Object.keys(PATHS).forEach(k => { if (!k.includes('::')) PATHS[k].classList.remove('sel'); }); }

function toggleTable(on){
  const tv = document.getElementById('tableview');
  if (on === false){ tv.style.display='none'; document.getElementById('btnTable').classList.remove('on'); return; }
  const cols = METRICS.filter(m => m.id !== 'elec');
  document.getElementById('tablebody').innerHTML = `
    <h1 style="font-size:17px">Every figure on this map, as text</h1>
    <p class="note mute">The same numbers the colours encode. Shares are of best candidates in multi-member wards.</p>
    <table><thead><tr><th>Ward</th><th>In seat</th>${cols.map(m=>`<th>${m.label}</th>`).join('')}</tr></thead>
    <tbody>${W.map(w => `<tr><td>${w.ward}</td><td>${Math.round(w.in_constituency_frac_pop*100)}%</td>${
      cols.map(m => { const v = m.get(w);
        return `<td>${v==null?'—':(m.kind==='div'?sign(v):(m.fmt?m.fmt(v):v))}${v!=null&&m.unit==='%'?'%':''}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table>`;
  tv.style.display = 'block'; document.getElementById('btnTable').classList.add('on');
}

function init(){
  const g = META.ge2024, L = META.locals2026_seat;
  document.getElementById('standfirst').innerHTML =
    `By-election called ${new Date(META.byelection2026.called).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}. Polling day not yet set. ` +
    `Eleven Camden wards, ${g.electorate.toLocaleString()} electors at the 2024 register.`;
  document.getElementById('msrc').textContent =
    'Sources: Camden Council declarations; ONS Census 2021; MHCLG deprivation 2025. Boundaries: ONS.';
  document.getElementById('msig').textContent = 'Built ' + META.built;

  const sel = document.getElementById('metric');
  METRICS.forEach((m,i) => { const o = document.createElement('option'); o.value=i; o.textContent=m.label; sel.appendChild(o); });
  sel.onchange = () => { cur = METRICS[+sel.value]; paint(); };

  document.getElementById('btnPS').onclick = e => {
    SHOWPS = !SHOWPS;
    document.getElementById('gps').style.display = SHOWPS ? '' : 'none';
    e.target.classList.toggle('on', SHOWPS);
  };
  document.getElementById('btnTable').onclick = () => toggleTable(true);

  const bar = r => { const t = r.reduce((s,x)=>s+x[2],0);
    return `<div style="display:flex;height:11px;border-radius:3px;overflow:hidden;margin:7px 0 5px;gap:2px">${
      r.map(x=>`<i style="width:${x[2]/t*100}%;background:${(PARTY[x[0]]||PARTY.Other).c}"></i>`).join('')}</div>`; };

  document.getElementById('headline').innerHTML = `
    <h2>The seat as it stands</h2>
    <p class="note"><b>General election, 4 July 2024.</b> Turnout ${g.turnout_pct}%.</p>
    ${bar(g.result)}
    <table><tbody>${g.result.slice(0,6).map(r =>
      `<tr><td class="p"><span class="chip" style="background:${(PARTY[r[0]]||PARTY.Other).c}"></span>${r[1]}</td>
       <td>${r[2].toLocaleString()}</td><td class="win">${r[3]}%</td></tr>`).join('')}</tbody></table>
    <p class="note"><b>Local elections, 7 May 2026</b>, summed across the eleven wards and weighted into the seat.</p>
    <table><tbody>${Object.entries(L.all_wards.shares).slice(0,6).map(([p,v]) =>
      `<tr><td class="p"><span class="chip" style="background:${(PARTY[p]||PARTY.Other).c}"></span>${
        (PARTY[p]||PARTY.Other).n}</td><td class="win">${v}%</td></tr>`).join('')}</tbody></table>
    <p class="note"><b>In the nine wards where a Green candidate stood</b>, the same sum reads Labour ${
      L.green_contested_wards_only.shares.Lab}% to Green ${L.green_contested_wards_only.shares.Green}%.</p>`;

  const rp = D.byelection2026_regents_park;
  const wd = n => W.find(w => w.ward === n);
  const KX = wd("King's Cross"), SP = wd('St Pancras and Somers Town');
  const tRise = W.filter(w => (w.derived.turnout_change_22_26 || 0) > 0).length;
  const tLo = W.reduce((a,b) => a.e2026.turnout_pct < b.e2026.turnout_pct ? a : b);
  const tHi = W.reduce((a,b) => a.e2026.turnout_pct > b.e2026.turnout_pct ? a : b);
  // Wards the Greens actually topped, not merely polled well in: the best Green
  // candidate outpolled every other party's best. Ranking by Green share alone
  // would wrongly include Kentish Town North, where Labour still won.
  const gWon = W.filter(w => {
    const b = w.e2026.best; if (!b.Green) return false;
    return Object.entries(b).every(([p,d]) => p === 'Green' || d.votes < b.Green.votes);
  });
  const wtd = (w,p) => (w.e2026.best[p] ? w.e2026.best[p].votes : 0) * w.in_constituency_frac_pop;
  const gV = Math.round(W.reduce((s,w) => s + wtd(w,'Green'), 0));
  const lV = Math.round(W.reduce((s,w) => s + wtd(w,'Lab'), 0));

  document.getElementById('findings').innerHTML = `
    <h2>Eight things in the numbers</h2>
    <ol>
      <li><b>The nine-point gap is mostly an artefact of not standing.</b> Across all eleven wards
        Labour led the Greens by ${(L.all_wards.shares.Lab - L.all_wards.shares.Green).toFixed(1)}
        points in May. Across the nine wards where a Green candidate was on the ballot the lead was
        ${(L.green_contested_wards_only.shares.Lab - L.green_contested_wards_only.shares.Green).toFixed(1)}
        points. A by-election puts one ballot paper across the whole seat, so the second number is
        the better comparison to make.</li>
      <li><b>Two wards had no Green candidate, and they are not empty.</b> None stood in
        King's Cross or St Pancras and Somers Town. The Camden People's Alliance took
        ${KX.e2026.best.CPA.share_pct}% and ${SP.e2026.best.CPA.share_pct}% there and won a seat in
        the second. Together the two wards hold about
        ${(KX.e2026.electorate + SP.e2026.electorate).toLocaleString()} electors, roughly a fifth of
        the seat, and they are the two most social-rented wards in it. What that vote does when a
        Green candidate is on the ballot is untested.</li>
      <li><b>In raw votes the May gap was about ${(lV-gV).toLocaleString()}.</b> Weighted into the
        seat, the best Labour candidates polled about ${lV.toLocaleString()} and the best Greens
        about ${gV.toLocaleString()}, on an estimated ${L.est_ballots.toLocaleString()} ballot
        papers. Two of those wards had no Green name to vote for.</li>
      <li><b>The Greens topped the poll in ${gWon.length} wards in May.</b> ${
        gWon.map(w => `${w.ward} on ${w.derived.green_share_2026}%`).join(' and ')}.
        In 2022 the Greens did not field a candidate in Holborn and Covent Garden at all, and
        polled ${wd("Regent's Park").e2022.best.Green.share_pct}% in Regent's Park. One of the
        three Regent's Park seats has since gone back to Labour at the July by-election.</li>
      <li><b>Regent's Park went back to Labour in July on a ${rp.turnout_pct}% turnout.</b>
        ${rp.result[0][1].split(' ').pop()} took ${rp.result[0][2]} votes to the Green
        ${rp.result[1][2]}, a margin of ${rp.result[0][2]-rp.result[1][2]}, with an independent on
        ${rp.result[2][2]}. Three months earlier the Greens had swept the ward. This is the only
        post-May test in the seat and the closest thing in the data to a by-election.</li>
      <li><b>Turnout rose in ${tRise} of the eleven wards and varies enormously.</b> From
        ${tLo.e2026.turnout_pct}% in ${tLo.ward} to ${tHi.e2026.turnout_pct}% in ${tHi.ward}.
        It fell only in ${W.find(w => (w.derived.turnout_change_22_26||0) <= 0).ward}, by
        ${Math.abs(W.find(w => (w.derived.turnout_change_22_26||0) <= 0).derived.turnout_change_22_26)}
        of a point.</li>
      <li><b>The Green vote here is not the graduate vote.</b> Across the nine contested wards the
        Green lead over Labour runs with social renting and against owner occupation and degree
        holding. Bloomsbury has the most students in the seat, ${wd('Bloomsbury').census2021.student_pct}%,
        and the Greens did not win it. See the table below, and the warning under it.</li>
      <li><b>Andrew Feinstein's 7,312 votes from 2024 are unattached.</b> He has declined to stand.
        No ward-level 2024 figures exist anywhere, so nothing in this data locates that vote.</li>
    </ol>`;

  const CO = META.correlations;
  document.getElementById('correl').innerHTML = `
    <h2>Where the Green vote sits</h2>
    <table><thead><tr><th>Ward characteristic</th><th>Green</th><th>Labour</th><th>Green lead</th></tr></thead>
    <tbody>${CO.rows.map(r => {
      const cell = v => { if (v == null) return '<td>—</td>';
        const strong = Math.abs(v) >= 0.5;
        return `<td style="color:${v>0?'#1b6b34':'#a91b2e'};font-weight:${strong?700:400}">${
          v>0?'+':''}${v.toFixed(2)}</td>`; };
      return `<tr><td>${r.variable}</td>${cell(r.r_green)}${cell(r.r_labour)}${cell(r.r_gap)}</tr>`;
    }).join('')}</tbody></table>
    <p class="note"><b>Read this carefully.</b> ${CO.warning} Correlation runs from −1 to +1;
    values above about 0.5 either way are bolded.</p>`;

  document.getElementById('method').innerHTML = `
    <h2>Method, and what this is not</h2>
    <p class="note">Local election shares are not a general election forecast, and a by-election is a third kind of contest again. Nothing here is a prediction.</p>
    <p class="note"><span class="tierA">Tier A</span> ward votes and turnout percentages, from the Camden declarations.
       <span class="tierB">Tier B</span> electorates and ballot counts, derived because Camden publishes turnout only as a percentage; census and deprivation figures, aggregated to wards by best-fit small area.
       <span class="tierC">Tier C</span> anything about Primrose Hill, which straddles two constituencies.</p>
    <ul>${META.confidence_notes.map(n => `<li>${n}</li>`).join('')}</ul>
    <h2 style="margin-top:12px">Who made this</h2>
    <p class="note">Built by George Sheldon Grün, 4 September 2026, from published sources only.
      No canvass data, no private polling, no voter records. The author is a Green Party member,
      which is a reason to check the workings rather than to take them on trust: the code, the
      dataset and every source are in the repository, and the page states where each figure is
      official and where it is derived.
      <a href="https://github.com/hackney-data-stories/holborn-st-pancras-map" style="color:#1b6b34">
      github.com/hackney-data-stories/holborn-st-pancras-map</a></p>
    <h2 style="margin-top:12px">Sources</h2>
    <ol>${META.sources.map(s => `<li>${s}.</li>`).join('')}
      <li>All sources are public and published under the Open Government Licence v3.0, except the Wikipedia transcriptions, which are CC BY-SA and used only to recover percentages.</li></ol>`;

  build(); paint();
}
init();
</script>
</body>
</html>
